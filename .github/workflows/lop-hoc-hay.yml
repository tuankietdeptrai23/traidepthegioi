name: Lop Hoc Hay
on:
  push:
    paths: ['lop-hoc-hay/**', '.github/workflows/lop-hoc-hay.yml']
  pull_request:
    paths: ['lop-hoc-hay/**', '.github/workflows/lop-hoc-hay.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lop-hoc-hay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: lop-hoc-hay/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
